apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  LLM_PROVIDER: "hosted"
  # OpenRouter: one key for chat and embeddings (OpenAI-compatible). For Google AI Studio
  # use https://generativelanguage.googleapis.com/v1beta/openai with gemini-2.5-flash-lite
  # and gemini-embedding-001 (3072 dims) instead.
  HOSTED_BASE_URL: "https://openrouter.ai/api/v1"
  # Cheapest current Gemini flash tier on OpenRouter (USD 0.25 per million prompt tokens).
  LLM_MODEL: "google/gemini-3.1-flash-lite"
  EMBED_PROVIDER: "hosted"
  # The pin. BGE-M3, 1024 dimensions, 8k context; the indexer records model and dimension
  # in the collection metadata and /readyz checks both.
  EMBED_MODEL: "baai/bge-m3"
  # BGE-M3 cosine scores run higher than the lexical embedder's; re-measure the floor and
  # the cache threshold with `make eval` (docs/PIPELINE.md) before trusting these.
  RELEVANCE_FLOOR: "0.45"
  CACHE_THRESHOLD: "0.92"
