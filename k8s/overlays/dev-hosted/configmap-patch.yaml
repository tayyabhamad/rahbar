apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  LLM_PROVIDER: "hosted"
  HOSTED_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
  # Free-tier quota is per model; flash-lite has the most room for the eval runs.
  LLM_MODEL: "gemini-2.5-flash-lite"
  EMBED_PROVIDER: "hosted"
  # The pin. 3072-dimensional; the indexer records model and dimension, /readyz checks both.
  EMBED_MODEL: "gemini-embedding-001"
  # Cosine scores from gemini-embedding-001 run higher than nomic's; re-measure the floor
  # (docs/PIPELINE.md, "Relevance floor") and the cache threshold with `make eval`.
  RELEVANCE_FLOOR: "0.55"
  CACHE_THRESHOLD: "0.95"
