# PLACEHOLDER ONLY. This file documents the shape of the Secret the api expects; it is
# deliberately NOT listed in any kustomization.yaml, because `kubectl apply -k` would then
# overwrite the real Secret with REPLACE_ME on every deploy.
#
# Create the real one from the command line, never from a file:
#   export LLM_API_KEY=...   (then)   make secret
# which runs: kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY=...
#
# The api Deployment mounts it with `envFrom: secretRef: {name: rahbar-secret, optional: true}`,
# so the stub and Ollama providers run without it.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar-secret
    app.kubernetes.io/part-of: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
