# RAHBAR base: every object, no environment-specific values. Overlays (dev, prod, ci)
# patch images, ConfigMap keys and the corpus source; see docs/ARCHITECTURE.md "Overlays".
#
# secret.placeholder.yaml is deliberately NOT listed: the real Secret is created with
# `make secret` and applying the placeholder would overwrite it with REPLACE_ME.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

labels:
  - pairs:
      app.kubernetes.io/part-of: rahbar
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - chroma-statefulset.yaml
  - chroma-service.yaml
  - redis-pvc.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - ui-deployment.yaml
  - ui-service.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
  - ingress.yaml
  - networkpolicies.yaml
