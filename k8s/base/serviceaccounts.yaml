# One ServiceAccount per workload. None of them talks to the Kubernetes API, so the token
# is never mounted (automountServiceAccountToken: false here and on every pod spec).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chroma
  labels:
    app.kubernetes.io/name: chroma
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
  labels:
    app.kubernetes.io/name: indexer
automountServiceAccountToken: false
