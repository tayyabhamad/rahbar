# The api: reads the index, never writes it. Three replicas behind one ClusterIP Service;
# the HPA (api-hpa.yaml) scales 3..8 on CPU.
#
# Resource numbers are starting points. Revisit them with `kubectl top pods -n rahbar`
# under load (make eval) and record the measurement in docs/evidence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  # Zero-downtime rollout: one extra pod comes up and passes its readiness probe before an
  # old one is taken down, so there are never fewer than 3 ready replicas.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      # preStop sleeps 5 s so the endpoint controller removes the pod from the Service
      # before uvicorn gets SIGTERM; 20 s total leaves 15 s for in-flight LLM calls to end.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rahbar-config
            # Only the api needs the LLM key, and only for the `hosted` provider.
            - secretRef:
                name: rahbar-secret
                optional: true
          # Startup: up to 60 s (30 x 2 s) for imports before liveness starts counting.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Liveness answers "is the process alive?" and touches no dependency, so a slow
          # Chroma or model can never cause a restart storm.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness answers "can this pod serve?": Chroma reachable, collection non-empty,
          # Redis reachable, embedding pin matches. Failing it only removes the pod from
          # the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
